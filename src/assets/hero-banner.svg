<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1088" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="0.55" stop-color="#121c3a"/>
      <stop offset="1" stop-color="#1a2750"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4893a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d4893a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a55"/>
      <stop offset="1" stop-color="#0a1022"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2750" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0f1832" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8fa6e0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1088" fill="url(#bg)"/>
  <rect width="1920" height="1088" fill="url(#grid)"/>
  <circle cx="1400" cy="530" r="560" fill="url(#glow)"/>

  <!-- Faint oversized lens rings behind the board (surveillance motif) -->
  <g transform="translate(1390 530)" fill="none" stroke="#4663b0" stroke-opacity="0.25">
    <circle r="470" stroke-width="2"/>
    <circle r="430" stroke-width="1" stroke-dasharray="3 10"/>
    <circle r="390" stroke="#d4893a" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M-470 0H470M0 -470V470" stroke-width="1"/>
  </g>

  <!-- Chennai skyline -->
  <g fill="url(#city)">
    <path d="M0 1088V860h60v-70h70v70h40v-120h80v120h50v-90h60v90h70v-40h60v40h70V700h70v160h50v-110h70v110h60V820h80v-60h60v60h60V640h70v220h60v-100h80v100h60V780h70v80h60v-170h80v170h60v-60h70v60h70V740h70v120h60v-90h70v90h60v-130h70v130h60V820h70v268z" opacity="0.9"/>
    <path d="M540 860v-130h200v130zM600 730v-40a40 40 0 0 1 80 0v40zM636 650v-50h8v50z"/>
    <path d="M1180 860V560h60v300zM1170 560l40-60 40 60zM1208 500v-40h4v40z"/>
    <path d="M1560 860l14-260h32l14 260zM1568 600h44v-24h-44zM1574 576l16-30 16 30z"/>
  </g>
  <rect y="880" width="1920" height="208" fill="#080d1c"/>

  <!-- Service board: 4 x 2 tiles -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g id="tiles" stroke="#d4893a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">

      <!-- 1. Matrimonial investigation: interlocked rings -->
      <g transform="translate(960 290)">
        <rect width="200" height="220" rx="10" fill="url(#tile)" stroke-width="1.5" stroke-opacity="0.55"/>
        <circle cx="80" cy="88" r="30"/><circle cx="120" cy="88" r="30"/>
        <path d="M100 48l7 10-7 10-7-10z" fill="#d4893a" stroke="none"/>
        <text x="100" y="170" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Matrimonial</text>
        <text x="100" y="192" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Investigation</text>
      </g>

      <!-- 2. Post-matrimonial: separated rings with a crack -->
      <g transform="translate(1180 290)">
        <rect width="200" height="220" rx="10" fill="url(#tile)" stroke-width="1.5" stroke-opacity="0.55"/>
        <circle cx="62" cy="88" r="26"/><circle cx="138" cy="88" r="26"/>
        <path d="M100 60l-8 16 14 10-10 14 8 12" stroke-width="3"/>
        <text x="100" y="170" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Post-Matrimonial</text>
        <text x="100" y="192" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Investigation</text>
      </g>

      <!-- 3. Employment verification: ID card + check -->
      <g transform="translate(1400 290)">
        <rect width="200" height="220" rx="10" fill="url(#tile)" stroke-width="1.5" stroke-opacity="0.55"/>
        <rect x="50" y="56" width="100" height="66" rx="6"/>
        <circle cx="76" cy="80" r="9"/><path d="M62 108c0-12 8-18 14-18s14 6 14 18"/>
        <path d="M102 76h34M102 90h34M102 104h22" stroke-width="3"/>
        <circle cx="146" cy="120" r="16" fill="#0f1832"/><path d="M138 120l6 6 10-12"/>
        <text x="100" y="170" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Employment</text>
        <text x="100" y="192" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Verification</text>
      </g>

      <!-- 4. Screening investigation: checklist -->
      <g transform="translate(1620 290)">
        <rect width="200" height="220" rx="10" fill="url(#tile)" stroke-width="1.5" stroke-opacity="0.55"/>
        <rect x="64" y="50" width="72" height="84" rx="6"/><rect x="86" y="44" width="28" height="12" rx="3" fill="#0f1832"/>
        <path d="M74 76l4 4 7-8M74 96l4 4 7-8M74 116l4 4 7-8" stroke-width="3"/>
        <path d="M94 76h34M94 96h34M94 116h26" stroke-width="3"/>
        <text x="100" y="170" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Screening</text>
        <text x="100" y="192" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Investigation</text>
      </g>

      <!-- 5. Missing person: map pin with person -->
      <g transform="translate(960 530)">
        <rect width="200" height="220" rx="10" fill="url(#tile)" stroke-width="1.5" stroke-opacity="0.55"/>
        <path d="M100 126c-26-26-34-40-34-56a34 34 0 0 1 68 0c0 16-8 30-34 56z"/>
        <circle cx="100" cy="66" r="9"/><path d="M86 90c0-12 8-16 14-16s14 4 14 16" stroke-width="3"/>
        <ellipse cx="100" cy="134" rx="30" ry="7" stroke-opacity="0.6" stroke-width="2.5"/>
        <text x="100" y="170" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Missing Person</text>
        <text x="100" y="192" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Investigation</text>
      </g>

      <!-- 6. Secret service: eye -->
      <g transform="translate(1180 530)">
        <rect width="200" height="220" rx="10" fill="url(#tile)" stroke-width="1.5" stroke-opacity="0.55"/>
        <path d="M46 88c16-26 36-38 54-38s38 12 54 38c-16 26-36 38-54 38S62 114 46 88z"/>
        <circle cx="100" cy="88" r="20"/><circle cx="100" cy="88" r="7" fill="#d4893a" stroke="none"/>
        <path d="M100 40v-8M64 52l-5-6M136 52l5-6" stroke-width="3"/>
        <text x="100" y="170" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Secret Service</text>
        <text x="100" y="192" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">&amp; Intelligence</text>
      </g>

      <!-- 7. Electronic counter-surveillance: radar / bug sweep -->
      <g transform="translate(1400 530)">
        <rect width="200" height="220" rx="10" fill="url(#tile)" stroke-width="1.5" stroke-opacity="0.55"/>
        <circle cx="100" cy="88" r="42"/><circle cx="100" cy="88" r="26" stroke-opacity="0.7" stroke-width="3"/>
        <path d="M100 88L128 60" /><circle cx="100" cy="88" r="4" fill="#d4893a" stroke="none"/>
        <circle cx="122" cy="106" r="5" fill="#e25d4a" stroke="none"/>
        <path d="M58 88h-12M142 88h12M100 46v-10M100 130v10" stroke-width="3"/>
        <text x="100" y="170" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Electronic Counter-</text>
        <text x="100" y="192" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Surveillance</text>
      </g>

      <!-- 8. Discreet photography: camera -->
      <g transform="translate(1620 530)">
        <rect width="200" height="220" rx="10" fill="url(#tile)" stroke-width="1.5" stroke-opacity="0.55"/>
        <path d="M54 62h24l8-12h28l8 12h24a8 8 0 0 1 8 8v54a8 8 0 0 1-8 8H54a8 8 0 0 1-8-8V70a8 8 0 0 1 8-8z"/>
        <circle cx="100" cy="98" r="26"/><circle cx="100" cy="98" r="13" stroke-width="3"/>
        <circle cx="134" cy="76" r="3" fill="#d4893a" stroke="none"/>
        <text x="100" y="170" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">Discreet Photo</text>
        <text x="100" y="192" fill="#f3e9d8" stroke="none" font-size="17" font-weight="600">&amp; Video Evidence</text>
      </g>
    </g>
  </g>

  <!-- Detective services: magnifier overlapping the board corner -->
  <g transform="translate(920 800)">
    <circle r="62" fill="#0b1226" fill-opacity="0.55" stroke="#d4893a" stroke-width="9"/>
    <circle r="48" fill="none" stroke="#f3e9d8" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M44 44L110 110" stroke="#d4893a" stroke-width="16" stroke-linecap="round"/>
    <path d="M-30 -22a42 42 0 0 1 34 -20" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Tracking path and caption -->
  <path d="M1080 960C1220 920 1360 980 1500 930S1700 900 1830 880" fill="none" stroke="#d4893a" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round" opacity="0.7"/>
  <circle cx="1500" cy="930" r="7" fill="#d4893a"/><circle cx="1500" cy="930" r="20" fill="none" stroke="#d4893a" stroke-opacity="0.5"/>
  <g font-family="monospace" font-size="18" fill="#8fa6e0" fill-opacity="0.75" letter-spacing="3">
    <text x="960" y="250">CASE FILE · CONFIDENTIAL</text>
    <text x="1500" y="250">13.0827° N  80.2707° E</text>
  </g>
</svg>
